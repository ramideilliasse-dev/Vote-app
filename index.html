 <!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vote App</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- TOPBAR -->
<div class="topbar">

  <div class="logo">
    VoteApp
  </div>

  <div class="top-actions">

    <button onclick="refreshFeed()">
      🔄
    </button>

    <button onclick="openMyProfile()">
      👤
    </button>

    <button onclick="logout()">
      🚪
    </button>

  </div>

</div>

<!-- AUTH -->
<div class="auth-container" id="authCard">

  <div class="auth-box">

    <h2>Connexion</h2>

    <input
    id="email"
    placeholder="Email">

    <input
    id="password"
    type="password"
    placeholder="Mot de passe">

    <button onclick="login()">
      Se connecter
    </button>

    <button onclick="register()">
      Créer un compte
    </button>

  </div>

</div>

<!-- MAIN FEED -->
<div id="mainFeed" style="display:none;">

  <!-- STORIES STYLE -->
  <div class="stories">

    <div class="story-card">
      🔥 Tendances
    </div>

    <div class="story-card">
      🏆 Populaire
    </div>

    <div class="story-card">
      📸 Nouveaux
    </div>

  </div>

  <!-- FEED -->
  <div id="feed"></div>

</div>

<script>

function openMyProfile(){

  window.location.href = "profile.html";

}

function openUserProfile(userId){

  window.location.href =
    "profile.html?user=" + userId;

}

</script>

<script type="module" src="app.js"></script>

</body>
</html>
